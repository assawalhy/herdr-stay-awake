id = "assawalhy.stay-awake"
name = "Stay Awake"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Keeps the machine from sleeping while any herdr agent pane is working (Linux, macOS, Windows, and WSL)"
platforms = ["linux", "macos", "windows"]

[[startup]]
command = ["node", "index.js"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "index.js"]

[[actions]]
id = "status"
title = "Stay Awake: status"
contexts = ["global", "workspace", "pane"]
command = ["node", "index.js"]

[[actions]]
id = "doctor"
title = "Stay Awake: doctor"
contexts = ["global", "workspace", "pane"]
command = ["node", "index.js"]

[[actions]]
id = "enable"
title = "Stay Awake: enable"
contexts = ["global", "workspace", "pane"]
command = ["node", "index.js"]

[[actions]]
id = "disable"
title = "Stay Awake: disable"
contexts = ["global", "workspace", "pane"]
command = ["node", "index.js"]

[[actions]]
id = "toggle"
title = "Stay Awake: toggle"
contexts = ["global", "workspace", "pane"]
command = ["node", "index.js"]

[[actions]]
id = "open-settings"
title = "Stay Awake: open settings"
contexts = ["global", "workspace", "pane"]
command = ["node", "index.js"]

[[panes]]
id = "settings"
title = "Stay Awake Settings"
placement = "popup"
width = "80%"
height = 20
command = ["node", "index.js"]
